    <script id="appearance-bootstrap">
      (() => {
        let night = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          const saved = localStorage.getItem('little-london-appearance');
          if (saved === 'night' || saved === 'day') night = saved === 'night';
        } catch { /* The system theme still works when storage is unavailable. */ }
        document.documentElement.dataset.theme = night ? 'night' : 'day';
        document.documentElement.dataset.glassTheme = night ? 'dark' : 'light';
        document.documentElement.style.colorScheme = night ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = night ? '#171c22' : '#a8c8bd';
      })();
    </script>
    <script id="world-loading-bootstrap">
      (() => {
        const worlds = ['london', 'dubai', 'bengaluru', 'agra', 'lisbon', 'moon'];
        let world = new URLSearchParams(location.search).get('world');
        if (!worlds.includes(world)) {
          try { world = localStorage.getItem('rpg-isomaptric-world'); } catch { world = null; }
        }
        document.documentElement.dataset.loadingWorld = world === 'moon' ? 'moon' : 'city';
        document.documentElement.style.setProperty('--loading-spinner-delay', `-${Date.now() % 1000}ms`);
      })();
    </script>
    <!-- loading-styles -->
    <title>rpg isomaptric</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <main id="app" aria-label="City explorer" aria-busy="true" inert></main>
    <div class="boot-loading" id="loading" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><h2><span class="loading-city">A little world awaits</span><span class="loading-moon">To the moon...</span></h2></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
